version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
      POSTGRES_DB: ats_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ats_user:ats_password@db:5432/ats_db
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
